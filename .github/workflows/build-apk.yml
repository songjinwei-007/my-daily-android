name: Build My Daily APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "MyDailyAndroid/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("MyDailyAndroid/app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No embedded application script found")
          Path("/tmp/mydaily-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/mydaily-app.js

      - name: Build APK
        working-directory: MyDailyAndroid
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyDaily-debug-apk
          path: MyDailyAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v2.2.${{ github.run_number }}"
          gh release create "$VERSION" \
            MyDailyAndroid/app/build/outputs/apk/debug/app-debug.apk \
            --title "My Daily $VERSION" \
            --notes "Direct APK build from commit ${{ github.sha }}"
