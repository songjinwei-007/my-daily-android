<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4f2eb"><title>My Daily</title>
<style>
:root{--bg:#f4f2eb;--panel:#fffefa;--soft:#eeeee5;--fg:#30372f;--muted:#81877c;--line:#e5e5da;--accent:#78916e;--accentSoft:#dce7d5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin-bottom:14px}.tabs button{flex:1;background:none;color:var(--muted);padding:10px 4px;border-radius:10px}.tabs button.on{background:var(--panel);color:var(--fg)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:14px}.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.month button,.soft{background:var(--soft);color:var(--fg);padding:8px 12px;border-radius:10px}button{border:0;font:inherit;cursor:pointer}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal span{text-align:center;color:var(--muted);font-size:11px;padding:6px 0}.day{background:none;color:var(--fg);border-radius:10px;min-height:48px;padding:5px 0}.day.sel{background:var(--accentSoft);outline:1px solid var(--accent)}.day small{display:block;color:var(--accent);font-size:9px;height:10px}.headrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.primary{background:var(--accent);color:white;border-radius:11px;padding:9px 13px}.task{display:flex;gap:9px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}.taskmain{flex:1;min-width:0}.taskname{font-weight:600}.taskname.done{text-decoration:line-through;color:var(--muted)}textarea,input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px;margin-top:7px;font:inherit;font-size:13px}textarea{min-height:54px;resize:vertical}.entry{padding:12px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.entry b{display:block}.entry p{white-space:pre-wrap;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:var(--soft);border-radius:9px;padding:8px 10px;font-size:12px}.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themegrid button{text-align:left;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);padding:12px;border-radius:12px}.stat strong{font-size:22px;display:block}.view{display:none}.view.show{display:block}.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}.hidden{display:none}
body.mono{--bg:#f1f1f1;--panel:#fff;--soft:#e9e9e9;--fg:#252525;--muted:#858585;--line:#dedede;--accent:#555;--accentSoft:#e2e2e2}body.cream{--bg:#fbf3e8;--panel:#fffaf2;--soft:#f3e8d9;--fg:#4a3d34;--muted:#9a8778;--line:#eadccc;--accent:#c18b65;--accentSoft:#f1dfcd}body.dark{--bg:#171b1b;--panel:#222929;--soft:#2d3635;--fg:#e7ece8;--muted:#a1aaa4;--line:#3b4542;--accent:#8ba99a;--accentSoft:#344a40}
</style></head><body><div class="wrap">
<header><div><h1>My Daily ✳</h1><div class="muted">把日子过成自己喜欢的样子</div></div><button class="soft" onclick="goToday()">今天</button></header>
<nav class="tabs"><button class="on" data-v="calendar">▦ 日历</button><button data-v="stats">▥ 统计</button><button data-v="settings">⚙ 设置</button></nav>
<section id="calendar" class="view show">
<div class="card"><div class="month"><button onclick="shift(-1)">‹</button><b id="month"></b><button onclick="shift(1)">›</button></div><div class="cal" id="cal"></div><p class="muted">有记录的日期会显示 ●</p></div>
<div class="card"><div class="headrow"><div><h2 id="dateTitle"></h2><div class="muted" id="dateSub"></div></div><span class="muted" id="progress"></span></div>
<div class="headrow"><b>每日打卡</b><button class="primary" onclick="addTask()">＋ 添加项目</button></div><div id="tasks"></div>
<div class="headrow"><b>自由记录</b><button class="primary" onclick="addEntry()">＋ 添加记录</button></div><div id="entries"></div></div></section>
<section id="stats" class="view"><div class="card"><h2>本月回顾</h2><div class="stats"><div class="stat"><strong id="days">0</strong><small>记录天数</small></div><div class="stat"><strong id="done">0</strong><small>完成打卡</small></div><div class="stat"><strong id="rate">—</strong><small>完成率</small></div></div><h2 style="margin-top:20px">习惯完成情况</h2><div id="habitStats"></div></div><div class="card"><h2>最近记录</h2><div id="recent"></div></div></section>
<section id="settings" class="view"><div class="card"><h2>界面主题</h2><div class="themegrid"><button onclick="theme('sage')">🌿 米白浅绿<br><small>简约日记风</small></button><button onclick="theme('mono')">◻ 黑白灰<br><small>极简高级风</small></button><button onclick="theme('cream')">♡ 奶油色<br><small>温柔可爱风</small></button><button onclick="theme('dark')">☾ 深色模式<br><small>安静专注风</small></button></div></div>
<div class="card"><h2>管理打卡项目</h2><div id="manage"></div><button class="primary" onclick="addTask()">＋ 新建项目</button></div>
<div class="card"><h2>数据备份</h2><p class="muted">导出 JSON 文件可备份全部记录。更换手机前请先导出。</p><div class="actions"><button onclick="exportData()">导出全部数据</button><button onclick="document.getElementById('file').click()">导入备份</button><input id="file" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></div></section>
</div><script>
const $=id=>document.getElementById(id), today=()=>key(new Date()),key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=k=>{let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let data;try{data=JSON.parse(localStorage.getItem('myDaily'))||null}catch(e){};if(!data)data={tasks:[{id:'read',name:'阅读'},{id:'english',name:'英语学习'},{id:'gym',name:'健身训练'},{id:'guitar',name:'吉他练习'}],days:{},theme:'sage'};
let selected=today(),month=parse(today());function save(){localStorage.setItem('myDaily',JSON.stringify(data));render()}
function day(k){return data.days[k]||(data.days[k]={tasks:{},entries:[]})}function status(k,id){return day(k).tasks[id]||(day(k).tasks[id]={done:false,note:''})}
function has(k){let x=data.days[k];return !!x&&(Object.values(x.tasks||{}).some(v=>v.done||v.note)&&true||(x.entries||[]).length>0)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCal(){ $('month').textContent=`${month.getFullYear()}年${month.getMonth()+1}月`;let f=new Date(month.getFullYear(),month.getMonth(),1),start=(f.getDay()+6)%7,n=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),html=['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('');for(let i=0;i<Math.ceil((start+n)/7)*7;i++){let d=i-start+1,dt=new Date(month.getFullYear(),month.getMonth(),d),k=key(dt);html+=`<button class="day ${k===selected?'sel':''}" onclick="selectDate('${k}')">${dt.getMonth()===month.getMonth()?dt.getDate():''}<small>${has(k)?'●':''}</small></button>`} $('cal').innerHTML=html}
function renderDay(){let d=parse(selected);$('dateTitle').textContent=`${d.getMonth()+1}月${d.getDate()}日`; $('dateSub').textContent=`${d.getFullYear()} · ${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][d.getDay()]}`;let done=0;$('tasks').innerHTML=data.tasks.map(t=>{let s=status(selected,t.id);if(s.done)done++;return `<div class="task"><input type="checkbox" ${s.done?'checked':''} onchange="toggle('${t.id}')"><div class="taskmain"><div class="taskname ${s.done?'done':''}">${esc(t.name)}</div><textarea placeholder="写下今天完成了什么、读了什么……" onchange="note('${t.id}',this.value)">${esc(s.note)}</textarea></div></div>`}).join('')||'<p class="muted">还没有打卡项目</p>';$('progress').textContent=`${done}/${data.tasks.length} 完成`;$('entries').innerHTML=(day(selected).entries||[]).map(e=>`<div class="entry"><b>${esc(e.title)}</b><p>${esc(e.body)}</p><div class="actions"><button onclick="editEntry('${e.id}')">编辑</button><button onclick="delEntry('${e.id}')">删除</button></div></div>`).join('')||'<p class="muted">今天还没有自由记录</p>'}
function renderStats(){let pre=key(month).slice(0,7),ks=Object.keys(data.days).filter(k=>k.startsWith(pre)),record=ks.filter(has).length,total=0,done=0;$('days').textContent=record;let html='';data.tasks.forEach(t=>{let a=0,b=0;ks.forEach(k=>{let s=data.days[k]?.tasks?.[t.id];if(s){a++;if(s.done)b++}});total+=a;done+=b;let p=a?Math.round(b/a*100):0;html+=`<div>${esc(t.name)} <span class="muted">${b}/${a}</span><div class="bar"><i style="width:${p}%"></i></div></div>`});$('done').textContent=done;$('rate').textContent=total?Math.round(done/total*100)+'%':'—';$('habitStats').innerHTML=html;let r=[];Object.entries(data.days).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,v])=>(v.entries||[]).forEach(e=>r.push(`<div class="entry"><b>${k} · ${esc(e.title)}</b><p>${esc(e.body)}</p></div>`)));$('recent').innerHTML=r.slice(0,8).join('')||'<p class="muted">暂无记录</p>'}
function renderManage(){$('manage').innerHTML=data.tasks.map(t=>`<div class="task"><div class="taskmain">${esc(t.name)}</div><button class="soft" onclick="renameTask('${t.id}')">改名</button><button class="soft" onclick="removeTask('${t.id}')">删除</button></div>`).join('')}
function render(){document.body.className=data.theme||'sage';renderCal();renderDay();renderStats();renderManage()}function selectDate(k){selected=k;month=parse(k);render()}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);selected=key(month);render()}function goToday(){selectDate(today())}
function toggle(id){status(selected,id).done=!status(selected,id).done;save()}function note(id,v){status(selected,id).note=v;save()}
function addTask(){let n=prompt('请输入打卡项目名称');if(n&&n.trim()){data.tasks.push({id:'t'+Date.now(),name:n.trim()});save()}}function renameTask(id){let t=data.tasks.find(x=>x.id===id),n=prompt('修改项目名称',t.name);if(n&&n.trim()){t.name=n.trim();save()}}function removeTask(id){if(confirm('删除这个打卡项目？历史数据仍保留在备份中。')){data.tasks=data.tasks.filter(t=>t.id!==id);save()}}
function addEntry(){let title=prompt('记录标题');if(title===null)return;let body=prompt('记录内容（可留空）')||'';day(selected).entries.unshift({id:'e'+Date.now(),title:title||'未命名记录',body});save()}function editEntry(id){let e=day(selected).entries.find(x=>x.id===id),t=prompt('记录标题',e.title);if(t===null)return;let b=prompt('记录内容',e.body);if(b!==null){e.title=t;e.body=b;save()}}function delEntry(id){if(confirm('删除这条记录？')){day(selected).entries=day(selected).entries.filter(x=>x.id!==id);save()}}
function theme(t){data.theme=t;save()}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='my-daily-backup.json';a.click();URL.revokeObjectURL(u)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.tasks||!x.days)throw 0;if(confirm('导入将覆盖当前数据，确定吗？')){data=x;save()}}catch(err){alert('备份文件格式不正确')}};r.readAsText(f)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));$(b.dataset.v).classList.add('show')});render();
</script></body></html>
