<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2eb"><title>My Daily</title>
<style>
:root{--bg:#f3f5fb;--panel:#ffffff;--soft:#f5f7fc;--fg:#303442;--muted:#858b9b;--line:#e5e9f2;--accent:#536ff2;--accentSoft:#edf1ff;--green:#27ad83;--purple:#8b75df;--modalButtonText:#303442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif}
.wrap{max-width:760px;margin:auto;padding:0 14px calc(92px + env(safe-area-inset-bottom))}

.headrow{display:flex;justify-content:space-between;align-items:center;margin:10px 0}.task{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}

.tasknote{display:flex;align-items:flex-end;gap:5px;margin-top:2px}.tasknote textarea{flex:1;width:100%;min-height:28px;height:28px;padding:3px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--fg);margin:0;font:inherit;font-size:13px;resize:none;overflow:hidden}.tasknote textarea.expanded{height:100px;min-height:100px;border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}.note-toggle{background:transparent;color:var(--muted);padding:2px 5px;font-size:17px;line-height:1}
.entry{padding:12px;border:1px solid var(--line);border-radius:12px;margin:9px 0}.entry b{display:block}.entry p{white-space:pre-wrap;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:var(--soft);border-radius:9px;padding:8px 10px;font-size:12px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);padding:10px;margin-top:7px;font:inherit;font-size:13px}textarea{min-height:54px;resize:vertical}
.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themegrid button{text-align:left;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--soft);padding:12px;border-radius:14px}.stat:nth-child(1){background:#536ff2;color:#fff}.stat:nth-child(2){background:#27ad83;color:#fff}.stat:nth-child(3){background:#8b75df;color:#fff}.stat small{opacity:.88}.stat strong{font-size:22px;display:block}.habit-card{padding:13px 0;border-bottom:1px solid var(--line)}.habit-head{width:100%;display:flex;align-items:center;gap:10px;background:transparent;color:var(--fg);padding:0;text-align:left}.habit-name{font-weight:650;flex:1}.habit-count{font-weight:700;color:var(--accent)}.habit-sub{font-size:12px;margin:5px 0}.habit-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.date-chip{background:var(--accentSoft);color:var(--accent);border-radius:8px;padding:5px 8px;font-size:12px}.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent)}
.hidden{display:none}.bottomnav{position:fixed;z-index:40;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;height:calc(64px + env(safe-area-inset-bottom));padding:0 8px env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -5px 20px #3034420a;display:flex}.bottomnav button{flex:1;background:transparent;color:var(--muted);font-size:13px}.bottomnav button.on{color:var(--accent);font-weight:700}.bottomnav button.on::before{content:"";display:block;width:22px;height:3px;border-radius:3px;background:var(--accent);margin:0 auto 5px}
.modalback{position:fixed;inset:0;z-index:50;background:#0005;display:none;align-items:center;justify-content:center;padding:22px}.modalback.show{display:flex}.modal{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.modal h2{margin-bottom:12px}.modal input,.modal textarea{margin:0 0 10px}.modal .actions{justify-content:flex-end}.modal .actions button{font-size:14px;padding:9px 14px;color:var(--fg)}.modal .actions button:not(.primary){background:var(--soft);color:var(--fg)}.modal .actions button.primary{background:var(--accent);color:#fff}.modal h2,.modal p{color:var(--fg)}.modal input,.modal textarea{color:var(--fg);background:var(--bg)}.modal input::placeholder,.modal textarea::placeholder{color:var(--muted);opacity:1}
body.mono{--bg:#f1f1f1;--panel:#fff;--soft:#e9e9e9;--fg:#252525;--muted:#858585;--line:#dedede;--accent:#555;--accentSoft:#e2e2e2;--green:#777}

body.dark{--modalButtonText:#f1f5f2;--bg:#171b1b;--panel:#222929;--soft:#2d3635;--fg:#e7ece8;--muted:#a1aaa4;--line:#3b4542;--accent:#8ba99a;--accentSoft:#344a40;--green:#4b9878}
</style></head><body><div class="wrap">
<header><div onclick="showView('calendar')" style="cursor:pointer"><h1>My Daily</h1><div class="muted" id="tagline"></div></div><button class="soft" onclick="goToday()">今天</button></header>
<div class="pagebody">
<section id="calendar" class="view show">
<div class="card"><div class="month"><button onclick="shift(-1)">‹</button><b id="month"></b><button onclick="shift(1)">›</button></div><div class="cal" id="cal"></div><p class="muted">有记录的日期会显示 ●</p></div>
<div class="card"><div class="headrow"><div><h2 id="dateTitle"></h2><div class="muted" id="dateSub"></div></div><span class="muted" id="progress"></span></div>
<div class="headrow"><b>每日打卡</b><button class="primary" onclick="addTask()">＋ 添加项目</button></div><div id="tasks"></div>
<div class="headrow"><b>自由记录</b><button class="primary" onclick="addEntry()">＋ 添加记录</button></div><div id="entries"></div></div></section>
<section id="stats" class="view"><div class="card"><h2 id="statsTitle">本月项目记录</h2><p class="muted" id="statsRange"></p><div id="habitStats"></div></div><div class="card"><h2>最近记录</h2><div id="recent"></div></div></section>
<section id="settings" class="view">
<div class="card"><h2>个性化</h2><label class="muted" for="quoteInput">顶部显示的话（可以留空）</label><input id="quoteInput" maxlength="60" placeholder="" onchange="setTagline(this.value)"></div>
<div class="card"><h2>统计周期</h2><select id="statsPeriod" onchange="setStatsPeriod(this.value)"><option value="week">本周</option><option value="month">本月</option><option value="quarter">本季度</option><option value="year">本年度</option></select></div>
<div class="card"><h2>界面主题</h2><div class="themegrid"><button onclick="theme('sage')">🌿 米白浅绿<br><small>简约日记风</small></button><button onclick="theme('mono')">◻ 黑白灰<br><small>极简高级风</small></button><button onclick="theme('cream')">♡ 奶油色<br><small>温柔可爱风</small></button><button onclick="theme('dark')">☾ 深色模式<br><small>安静专注风</small></button></div></div>
<div class="card"><h2>管理打卡项目</h2><div id="manage"></div><button class="primary" onclick="addTask()">＋ 新建项目</button></div>
<div class="card"><h2>数据备份与恢复</h2><p class="muted">记录保存在当前手机。更换手机或重装前，请导出备份文件并妥善保存；在新手机上选择该文件即可恢复。</p><p class="muted" id="backupTime">尚未备份</p><div class="actions"><button onclick="exportData()">导出全部数据</button><button onclick="document.getElementById('file').click()">导入备份</button><input id="file" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div></div>
</section></div></div>
<nav class="bottomnav"><button data-v="calendar" class="on">日历</button><button data-v="stats">统计</button><button data-v="settings">设置</button></nav>
<div class="modalback" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><h2 id="modalTitle"></h2><div id="modalFields"></div><div class="actions"><button onclick="closeModal()">取消</button><button class="primary" onclick="submitModal()">保存</button></div></div></div>
<script>
const $=id=>document.getElementById(id),today=()=>key(new Date()),key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),parse=k=>{let a=k.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
let data;try{data=JSON.parse(localStorage.getItem("myDaily"))||null}catch(e){}if(!data)data={tasks:[{id:"read",name:"阅读"},{id:"english",name:"英语学习"},{id:"gym",name:"健身训练"},{id:"guitar",name:"吉他练习"}],days:{},theme:"sage"};
// Repair older or partially-written local data before rendering. Keep all valid
// task/day records; discard only malformed entries that would stop the whole UI.
if(!data||typeof data!=="object"||Array.isArray(data))data={};
if(!Array.isArray(data.tasks))data.tasks=[];
data.tasks=data.tasks.filter(t=>t&&typeof t==="object"&&typeof t.id==="string"&&typeof t.name==="string"&&t.id.length>0);
if(!data.days||typeof data.days!=="object"||Array.isArray(data.days))data.days={};
Object.keys(data.days).forEach(k=>{
 const d=data.days[k];
 if(!d||typeof d!=="object"||Array.isArray(d)){delete data.days[k];return}
 if(!d.tasks||typeof d.tasks!=="object"||Array.isArray(d.tasks))d.tasks={};
 if(!Array.isArray(d.entries))d.entries=[];
 d.entries=d.entries.filter(e=>e&&typeof e==="object");
});
if(!["sage","mono","cream","dark"].includes(data.theme))data.theme="sage";
let selected=today(),month=parse(today());
function save(){try{localStorage.setItem("myDaily",JSON.stringify(data));render()}catch(e){alert("保存失败：手机存储空间可能不足，请先导出备份。")}}
function day(k){return data.days[k]||(data.days[k]={tasks:{},entries:[]})}function status(k,id){return day(k).tasks[id]||(day(k).tasks[id]={done:false,note:""})}
function has(k){let x=data.days[k];if(!x)return false;let activeIds=new Set(data.tasks.map(t=>t.id));let taskRecords=Object.entries(x.tasks||{}).some(([id,v])=>activeIds.has(id)&&v&&(v.done||(typeof v.note==="string"&&v.note.trim())));return taskRecords||(x.entries||[]).length>0)}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderCal(){$("month").textContent=month.getFullYear()+"年"+(month.getMonth()+1)+"月";let f=new Date(month.getFullYear(),month.getMonth(),1),start=(f.getDay()+6)%7,n=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),html=["一","二","三","四","五","六","日"].map(x=>"<span>"+x+"</span>").join("");for(let i=0;i<Math.ceil((start+n)/7)*7;i++){let d=i-start+1,dt=new Date(month.getFullYear(),month.getMonth(),d);if(dt.getMonth()!==month.getMonth()){html+="<span></span>";continue}let k=key(dt);html+='<button class="day '+(k===selected?"sel":"")+'" onclick="selectDate(\''+k+'\')">'+dt.getDate()+"<small>"+(has(k)?"●":"")+"</small></button>"}$("cal").innerHTML=html}
function renderDay(){let d=parse(selected);$("dateTitle").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日";$("dateSub").textContent=d.getFullYear()+" · "+["星期日","星期一","星期二","星期三","星期四","星期五","星期六"][d.getDay()];let done=0;$("tasks").innerHTML=data.tasks.map(t=>{let s=data.days[selected]?.tasks?.[t.id]||{done:false,note:""};if(s.done)done++;return '<div class="task"><input type="checkbox" '+(s.done?"checked":"")+' onchange="toggle(\''+t.id+'\')"><div class="taskmain"><div class="taskname '+(s.done?"done":"")+'">'+esc(t.name)+'</div><div class="tasknote"><textarea id="note-'+t.id+'" rows="1" aria-label="'+esc(t.name)+'备注" onchange="note(\''+t.id+'\',this.value)">'+esc(s.note)+'</textarea><button class="note-toggle" aria-label="展开备注" onclick="toggleNote(\''+t.id+'\')">⌄</button></div></div></div>'}).join("")||'<p class="muted">还没有打卡项目</p>';$("progress").textContent=done+"/"+data.tasks.length+" 完成";let entries=data.days[selected]?.entries||[];$("entries").innerHTML=entries.map(e=>'<div class="entry"><b>'+esc(e.title)+'</b><p>'+esc(e.body)+'</p><div class="actions"><button onclick="editEntry(\''+e.id+'\')">编辑</button><button onclick="delEntry(\''+e.id+'\')">删除</button></div></div>').join("")||'<p class="muted">今天还没有自由记录</p>'}
function periodRange(){let now=new Date(),p=data.statsPeriod||"month",s,e;if(p==="week"){s=new Date(now);s.setDate(now.getDate()-((now.getDay()+6)%7));s.setHours(0,0,0,0);e=new Date(s);e.setDate(s.getDate()+6)}else if(p==="quarter"){let q=Math.floor(now.getMonth()/3);s=new Date(now.getFullYear(),q*3,1);e=new Date(now.getFullYear(),q*3+3,0)}else if(p==="year"){s=new Date(now.getFullYear(),0,1);e=new Date(now.getFullYear(),11,31)}else{s=new Date(now.getFullYear(),now.getMonth(),1);e=new Date(now.getFullYear(),now.getMonth()+1,0)}return{start:s,end:e,period:p}}
function renderStats(){let r=periodRange(),s=r.start,e=r.end,p=r.period;let labels={week:"本周项目记录",month:"本月项目记录",quarter:"本季度项目记录",year:"本年度项目记录"};$("statsTitle").textContent=labels[p];$("statsRange").textContent=key(s)+" 至 "+key(e);let ks=Object.keys(data.days).filter(k=>{let d=parse(k);return d>=s&&d<=e}).sort(),html="";data.tasks.forEach(t=>{let dates=ks.filter(k=>data.days[k]?.tasks?.[t.id]?.done===true),n=dates.length,id="detail-"+t.id;html+='<div class="habit-card"><button class="habit-head" onclick="toggleHabitDetail(\''+esc(t.id)+'\')"><span class="habit-name">'+esc(t.name)+'</span><span class="habit-count">'+n+' 天</span><span class="muted">⌄</span></button><div class="habit-sub muted">'+({week:"本周",month:"本月",quarter:"本季度",year:"本年度"})[p]+'打卡 '+n+' 天</div><div class="bar"><i style="width:'+Math.round(n/Math.max(1,Math.round((e-s)/86400000)+1)*100)+'%"></i></div><div class="habit-dates hidden" id="'+id+'">'+(dates.length?dates.map(k=>'<span class="date-chip">'+(parse(k).getMonth()+1)+'/'+parse(k).getDate()+'</span>').join(""):'<span class="muted">这个周期还没有打卡记录</span>')+'</div></div>'});$("habitStats").innerHTML=html||'<p class="muted">还没有打卡项目，添加项目后这里会显示对应记录。</p>';let recent=[];Object.entries(data.days).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([k,v])=>(v.entries||[]).forEach(e=>recent.push('<div class="entry"><b>'+k+' · '+esc(e.title)+'</b><p>'+esc(e.body)+'</p></div>')));$("recent").innerHTML=recent.slice(0,8).join("")||'<p class="muted">暂无记录</p>'}
function toggleHabitDetail(id){let el=$("detail-"+id);if(el)el.classList.toggle("hidden")}
function renderManage(){$("manage").innerHTML=data.tasks.map(t=>'<div class="task"><div class="taskmain">'+esc(t.name)+'</div><button class="soft" onclick="renameTask(\''+t.id+'\')">改名</button><button class="soft" onclick="removeTask(\''+t.id+'\')">删除</button></div>').join("")}
function render(){document.body.className=data.theme||"sage";renderCal();renderDay();renderStats();renderManage();$("tagline").textContent=data.tagline||"";$("quoteInput").value=data.tagline||"";$("statsPeriod").value=data.statsPeriod||"month";let bt=data.lastBackupAt?new Date(data.lastBackupAt):null;$("backupTime").textContent=bt?"上次备份："+bt.toLocaleString():"尚未备份"}
function selectDate(k){selected=k;month=parse(k);render()}function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);selected=key(month);render()}function goToday(){selectDate(today())}
function toggle(id){status(selected,id).done=!status(selected,id).done;save()}function note(id,v){status(selected,id).note=v;try{localStorage.setItem("myDaily",JSON.stringify(data));renderCal()}catch(e){}}function toggleNote(id){let el=$("note-"+id);el.classList.toggle("expanded");if(el.classList.contains("expanded")){el.style.height="100px";el.focus()}else{el.style.height="28px"}}
let modalAction=null;function openModal(title,fields,action){$("modalTitle").textContent=title;$("modalFields").innerHTML=fields;modalAction=action;$("modalBack").classList.add("show");let first=$("modalFields").querySelector("input,textarea");if(first)first.focus()}function closeModal(){$("modalBack").classList.remove("show");modalAction=null}function submitModal(){if(modalAction)modalAction();closeModal()}
function addTask(){openModal("添加打卡项目",'<input id="modalName" maxlength="30" placeholder="项目名称">',()=>{let n=$("modalName").value.trim();if(n){data.tasks.push({id:"t"+Date.now(),name:n});save()}})}
function renameTask(id){let t=data.tasks.find(x=>x.id===id);openModal("修改项目名称",'<input id="modalName" maxlength="30" value="'+esc(t.name)+'">',()=>{let n=$("modalName").value.trim();if(n){t.name=n;save()}})}
function removeTask(id){openModal("删除打卡项目",'<p class="muted">确定删除这个项目吗？该项目在所有日期的打卡状态和备注也会一并删除，且无法恢复。</p>',()=>{data.tasks=data.tasks.filter(t=>t.id!==id);Object.values(data.days).forEach(d=>{if(d&&d.tasks)delete d.tasks[id]});save()})}
function addEntry(){openModal("添加记录",'<input id="modalTitleInput" maxlength="60" placeholder="记录标题"><textarea id="modalBodyInput" rows="4" placeholder="记录内容（可以留空）"></textarea>',()=>{let title=$("modalTitleInput").value.trim()||"未命名记录",body=$("modalBodyInput").value;day(selected).entries.unshift({id:"e"+Date.now(),title:title,body:body});save()})}
function editEntry(id){let e=day(selected).entries.find(x=>x.id===id);openModal("编辑记录",'<input id="modalTitleInput" maxlength="60" value="'+esc(e.title)+'"><textarea id="modalBodyInput" rows="4">'+esc(e.body)+'</textarea>',()=>{e.title=$("modalTitleInput").value.trim()||"未命名记录";e.body=$("modalBodyInput").value;save()})}
function delEntry(id){openModal("删除记录",'<p class="muted">确定删除这条记录吗？</p>',()=>{day(selected).entries=day(selected).entries.filter(x=>x.id!==id);save()})}
function theme(t){data.theme=t;save()}function setTagline(v){data.tagline=v.trim();save()}function setStatsPeriod(v){data.statsPeriod=v;save()}
function exportData(){data.lastBackupAt=new Date().toISOString();try{localStorage.setItem("myDaily",JSON.stringify(data))}catch(e){}let content=JSON.stringify(data,null,2);render();if(window.AndroidBridge&&typeof AndroidBridge.saveBackup==="function"){AndroidBridge.saveBackup("my-daily-backup.json",content);return}let a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type:"application/json"}));a.href=u;a.download="my-daily-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function importData(e){let f=e.target.files&&e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.tasks)||!x.days||typeof x.days!=="object"||Array.isArray(x.days)||!x.tasks.every(t=>t&&typeof t.id==="string"&&typeof t.name==="string"))throw new Error("invalid");openModal("导入备份",'<p class="muted">导入将覆盖当前数据，建议先导出当前备份。确定继续吗？</p>',()=>{data={tasks:x.tasks,days:x.days,theme:["sage","mono","cream","dark"].includes(x.theme)?x.theme:"sage",tagline:x.tagline||"",statsPeriod:x.statsPeriod||"month",lastBackupAt:x.lastBackupAt||null};save()})}catch(err){alert("备份文件格式不正确或已损坏，未修改现有数据。")}finally{e.target.value=""}};r.readAsText(f)}
function showView(id){document.querySelectorAll(".view").forEach(x=>x.classList.remove("show"));$(id).classList.add("show");document.querySelectorAll(".bottomnav button").forEach(x=>x.classList.toggle("on",x.dataset.v===id));if(id==="calendar"){renderCal();renderDay()}}document.querySelectorAll(".bottomnav button").forEach(b=>b.onclick=()=>showView(b.dataset.v));
try{
 render();
}catch(error){
